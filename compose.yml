services:
  postgres:
    image: postgres:17
    container_name: lightbrary-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Asdf1234!}
      POSTGRES_DB: ${POSTGRES_DB:-lightbrary_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

volumes:
  postgres_data:
    driver: local
